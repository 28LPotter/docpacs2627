<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Masher Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js"></script>
</head>

<body>
    
    <div id="scoreBox">
        <p>Score:</p>
        <p id="scoreHolder">0</p>
    </div>

    <div id="timerBox">

        <p id="timerHolder">0</p>

    <div id="directionBox">

        <p id="directionHolder"></p>
    </div>

    
    <div id="controllerStatus">
        <p id="controllerStatusHolder"></p>
    </div>

</body>

</html>
